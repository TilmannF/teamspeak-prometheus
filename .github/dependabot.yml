version: 2
updates:
  # Keeps the commit-SHA pins in the workflows from rotting. This is the one
  # that matters most here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  # requirements.txt and requirements-dev.txt declare ranges, and the floors
  # are real: the suite is verified against the oldest version in each range
  # (see requirements.txt). requirements-release.txt pins exact versions with
  # hashes; Dependabot bumps both.
  # Only move a floor or ceiling when a new release falls outside the range --
  # the image installs the newest allowed version anyway. The default strategy
  # would raise every floor to the latest release.
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
