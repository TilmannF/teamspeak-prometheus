name: Scorecard

# OpenSSF Scorecard only runs on the default branch, so this will not appear
# as a check on pull requests, and the first real score lands after this
# workflow merges to main.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday

permissions:
  contents: read

jobs:
  analyze:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
