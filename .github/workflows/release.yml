name: Release

# Triggered by pushing a vX.Y.Z tag (see docs/releasing.md). workflow_dispatch
# with dry_run lets the multi-arch build be proven before the first real tag
# exists -- a dry run builds but never pushes, attests, or creates a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only -- skip push, attestation, and the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: build, push, attest, release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve dry run
        id: dry_run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # secrets.* cannot appear directly in `if:`, so read it into env here
      # and expose a plain step output that later `if:` conditions can key on.
      # `if: secrets.DOCKERHUB_TOKEN != ''` silently evaluates false and the
      # push never happens.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # ghcr.io requires a lowercase repository name; github.repository keeps
      # the owner's case ("TilmannF/..."). Computed once so the pushed image
      # and the attested subject-name below can't drift apart.
      - name: Resolve lowercase GHCR image name
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # When Docker Hub credentials are absent, the second image line
      # resolves to an empty entry and metadata-action drops it -- no
      # docker.io tag is produced, so the push step below never attempts a
      # push there and the missing login above is harmless.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v6.2.0
        id: meta
        with:
          images: |
            ${{ steps.ghcr.outputs.image }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && 'docker.io/tilmannf/teamspeak-prometheus' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.dry_run.outputs.value != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.dry_run.outputs.value != 'true'
        with:
          subject-name: ${{ steps.ghcr.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push' && steps.dry_run.outputs.value != 'true'
        with:
          generate_release_notes: true
