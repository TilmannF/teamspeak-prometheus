name: CI

# CI runs the same `make` targets the documentation tells contributors to run,
# so a broken entry point fails here instead of on someone's first clone.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    name: lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the container image runs. 3.13 and 3.14 prove the
        # exporter itself is not stuck there -- only the archived ts3
        # dependency is, see docs/modernization-backlog.md.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: make setup
        run: make setup

      - name: make check
        run: make check

      - name: make run-fake
        run: make run-fake RUN_FAKE_ARGS="--iterations 2 --interval 0.2"

  smoke:
    name: smoke tests (py3.12, real ts3 package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: make setup
        run: make setup

      - name: make test-smoke
        run: make test-smoke

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t teamspeak-prometheus:ci .
